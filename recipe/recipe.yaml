schema_version: 1

context:
  version: "0.6b0"

package:
  name: opentelemetry-opamp-client
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-opamp-client/opentelemetry_opamp_client-${{ version }}.tar.gz
  sha256: 8fb5d91a85e4c457c89690b31f17016dd93e58aadbd5aff4540842fbb60767da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.12,<2.dev0
    - protobuf >=5.0,<8.0
    - requests >=2.0,<3

tests:
  - python:
      imports:
        - opentelemetry._opamp.client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: OpenTelemetry OpAMP client
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/opamp/opentelemetry-opamp-client

extra:
  recipe-maintainers:
    - BrownMunda1
